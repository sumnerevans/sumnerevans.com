{{- if partial "func/FilterPages" (.Site.RegularPages.Related .) -}}
<aside class="related-posts">
  <h3>RELATED POSTS</h3>
  <section class="articles">
    <ul>
      {{- range (.Site.RegularPages.Related . | partial "func/FilterPages" | first 5) -}}
      <li>
        <b><a href="{{ .RelPermalink }}">{{ .Title }}</a></b>
        <small class="source">
          on {{ .Date.Format (default "2006-01-02" .Site.Params.dateFmt) }}
        </small>
      </li>
      {{- end -}}
    </ul>
  </section>
</aside>
{{- end -}}
